<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#15100b">
  <title>O Portão das Cores</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="palette-shell">
    <div class="topbar">
      <div>
        <h1>O Portão das Cores</h1>
        <p class="subtitle" id="gameSubtitle">Descubra as cores na ordem correta</p>
      </div>
      <button class="restart" id="restart" type="button">Recomeçar</button>
    </div>
    <div class="palette" id="palette" aria-label="Cores disponíveis"></div>
  </header>

  <main>
    <p class="instructions"><strong>Verde</strong>: cor e posição certas. <strong>Branco</strong>: cor certa em outra posição.</p>
    <section id="board" aria-live="polite" aria-label="Tentativas"></section>
  </main>

  <canvas id="confetti" aria-hidden="true"></canvas>

  <div class="modal" id="victoryModal" role="dialog" aria-modal="true" aria-labelledby="victoryTitle">
    <div class="victory-card">
      <section class="victory-upper">
        <h2 id="victoryTitle">O PORTÃO FOI ABERTO</h2>
        <img class="victory-gif" src="Portao_da_Torre_sem_bordas.gif" alt="Portão medieval se abrindo e revelando a passagem para a torre">
      </section>
      <section class="victory-lower">
        <div class="solution" id="solution" aria-label="Sequência correta de cores e números"></div>
        <p class="victory-message">Agora junte os fragmentos de cada escudo, <br>monte a chave e desperte o <br><a class="book-link" href="LivroEnigmas.html">Livro dos Enigmas</a></p>
        
      </section>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
