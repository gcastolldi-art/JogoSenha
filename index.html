<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#111318">
  <title>Jogo da Senha</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="palette-shell">
    <div class="topbar">
      <div>
        <h1>Jogo da Senha</h1>
        <p class="subtitle" id="gameSubtitle">Descubra as cores na ordem correta</p>
      </div>
      <button class="restart" id="restart" type="button">Reiniciar</button>
    </div>
    <div class="palette" id="palette" aria-label="Cores disponíveis"></div>
  </header>

  <main>
    <p class="instructions">Verde: cor e posição certas. Branco: cor certa em outra posição.</p>
    <section id="board" aria-live="polite" aria-label="Tentativas"></section>
  </main>

  <canvas id="confetti" aria-hidden="true"></canvas>

  <div class="modal" id="victoryModal" role="dialog" aria-modal="true" aria-labelledby="victoryTitle">
    <div class="victory-card">
      <h2 id="victoryTitle">Você acertou!</h2>
      <div class="solution" id="solution" aria-label="Sequência correta"></div>
      <p>Com essas cores siga para resolver o enigma.</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
